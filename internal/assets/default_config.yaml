# Fluxid Configuration
# Workflow automation for coding agents

# Command file paths (must be absolute paths)
# Placeholders like {{FLUXID_DIR}} are replaced during 'fluxid init'
commands:
  implement: {{FLUXID_DIR}}/commands/fluxid.implement-e2e.md
  review: {{FLUXID_DIR}}/commands/fluxid.review-implementation-e2e.md
  commit: {{FLUXID_DIR}}/commands/fluxid.commit.md

# Optional: Override defaults
# agent: claude                  # Default: claude
# implement_retries: 3           # Default: 3
# iterations: 20                 # Default: 20
