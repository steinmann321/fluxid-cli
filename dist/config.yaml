version: 2
project_name: fluxid-cli
release:
  github:
    owner: steinmann321
    name: fluxid-cli
  name_template: '{{.Tag}}'
aurs:
  - name: fluxid-bin
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: Update to {{ .Tag }}
    description: CLI workflow orchestration for coding agents with Implement-Review-Commit loop
    homepage: https://github.com/steinmann321/fluxid-cli
    license: MIT
    maintainers:
      - Jakob Steinmann <noreply@github.com>
    provides:
      - fluxid-cli
    conflicts:
      - fluxid-cli
    rel: "1"
    package: |-
      install -Dm755 "./fluxid" "${pkgdir}/usr/bin/fluxid"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/fluxid/LICENSE"
    git_url: ssh://aur@aur.archlinux.org/fluxid-bin.git
    private_key: '{{ .Env.AUR_KEY }}'
    goamd64: v1
builds:
  - id: fluxid
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
      - windows_arm64_v8.0
    dir: .
    main: ./cmd/fluxid
    binary: fluxid
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w
      - -X fluxid-cli/internal/version.Version={{.Version}}
      - -X fluxid-cli/internal/version.GitCommit={{.Commit}}
      - -X fluxid-cli/internal/version.BuildDate={{.Date}}
    env:
      - CGO_ENABLED=0
archives:
  - id: default
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_ {{- .Version }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
        format: zip
    files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
      - src: changelog*
      - src: CHANGELOG*
    format: tar.gz
nfpms:
  - file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    package_name: fluxid
    contents:
      - src: LICENSE
        dst: /usr/share/doc/fluxid/copyright
        file_info:
          mode: 420
    rpm:
      group: Development/Tools
      compression: lzma
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package
    id: fluxid
    formats:
      - deb
      - rpm
      - apk
    section: utils
    priority: optional
    vendor: Jakob Steinmann
    homepage: https://github.com/steinmann321/fluxid-cli
    maintainer: Jakob Steinmann <noreply@github.com>
    description: CLI workflow orchestration for coding agents with Implement-Review-Commit loop
    license: MIT
    bindir: /usr/bin
    libdirs:
      header: /usr/include
      carchive: /usr/lib
      cshared: /usr/lib
snapshot:
  version_template: '{{ incpatch .Version }}-next'
checksum:
  name_template: checksums.txt
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  sort: asc
  format: '{{ .SHA }} {{ .Message }}'
dist: dist
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - go mod tidy
    - go test ./...
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ mdv2escape .ProjectName }} {{ mdv2escape .Tag }} is out{{ mdv2escape "!" }} Check it out at {{ mdv2escape .ReleaseURL }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
chocolateys:
  - name: fluxid
    title: fluxid
    authors: Jakob Steinmann
    project_url: https://github.com/steinmann321/fluxid-cli
    url_template: https://github.com/steinmann321/fluxid-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    icon_url: https://raw.githubusercontent.com/steinmann321/fluxid-cli/main/assets/icon.png
    copyright: 2026 Jakob Steinmann
    license_url: https://github.com/steinmann321/fluxid-cli/blob/main/LICENSE
    project_source_url: https://github.com/steinmann321/fluxid-cli
    docs_url: https://github.com/steinmann321/fluxid-cli/blob/main/README.md
    bug_tracker_url: https://github.com/steinmann321/fluxid-cli/issues
    tags: cli workflow automation agent orchestration
    summary: CLI workflow orchestration for coding agents
    description: |
      fluxid is a CLI workflow orchestration tool that enables coding agents to break through
      context window limitations using an Implement-Review-Commit loop.
    release_notes: https://github.com/steinmann321/fluxid-cli/releases/tag/v{{ .Version }}
    api_key: '{{ .Env.CHOCOLATEY_API_KEY }}'
    source_repo: https://push.chocolatey.org/
    goamd64: v1
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
brews:
  - name: fluxid
    repository:
      owner: steinmann321
      name: homebrew-tap
      token: '{{ .Env.GITHUB_TOKEN }}'
    commit_author:
      name: Jakob Steinmann
      email: noreply@github.com
    commit_msg_template: Brew formula update for {{ .ProjectName }} version {{ .Tag }}
    directory: Formula
    install: |
      bin.install "fluxid"
    test: |
      system "#{bin}/fluxid", "version"
    description: CLI workflow orchestration for coding agents with Implement-Review-Commit loop
    homepage: https://github.com/steinmann321/fluxid-cli
    license: MIT
    goarm: "6"
    goamd64: v1
