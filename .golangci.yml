# CRITICAL: Modifying this file without explicit user approval is considered cheating and strictly forbidden.
# All lint rules and thresholds are locked. Do not change.
version: 2
run:
  timeout: 5m
  tests: true
  go: "1.25"
  # Always use the latest binary; ensure ruleguard support

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - gocyclo
    - gocognit
    - asciicheck
    - durationcheck
    - errorlint
    - exhaustive
    - copyloopvar
    - forbidigo
    - gochecknoinits
    - gochecknoglobals
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - lll
    - misspell
    - nolintlint
    - prealloc
    - unconvert
    - unparam
    - whitespace
    - bodyclose
    - dupl
    - dogsled
    - errchkjson
    - exhaustruct
    - nakedret
    - nestif
    - nilerr
    - noctx
    - paralleltest
    - tagliatelle
    - usetesting
    - thelper
    - tparallel
    - wrapcheck

  settings:
    tagliatelle:
      case:
        rules:
          yaml: snake
          json: snake

linters-settings:
  gocyclo:
    min-complexity: 10
  gocognit:
    min-complexity: 12
  lll:
    line-length: 120
  revive:
    severity: error
    rules:
      - name: exported
      - name: error-return
      - name: argument-limit


  tagliatelle:
    case:
      rules:
        yaml: snake
        json: snake
  wrapcheck:
    ignore-sigs:
      - errors.New
      - .Errorf(
      - fmt.Errorf

formatters:
  enable:
    - gofumpt

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
