# CRITICAL: Modifying this file without explicit user approval is considered cheating and strictly forbidden.
# All lint rules and thresholds are locked. Do not change.
version: 2
run:
  timeout: 5m
  tests: true
  go: "1.25"
  # Always use the latest binary; ensure ruleguard support

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - gocyclo
    - gocognit
    - asciicheck
    - durationcheck
    - errorlint
    - exhaustive
    - copyloopvar
    - forbidigo
    - gochecknoinits
    - gochecknoglobals
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - lll
    - misspell
    - nolintlint
    - prealloc
    - unconvert
    - unparam
    - whitespace
    - bodyclose
    - dupl
    - dogsled
    - errchkjson
    - exhaustruct
    - nakedret
    - nestif
    - nilerr
    - noctx
    - paralleltest
    - tagliatelle
    - usetesting
    - thelper
    - tparallel
    - wrapcheck
    - mnd
    - contextcheck
    - reassign
    - nilnil
    - forcetypeassert
    - err113
    - errname
    - funlen
    - ireturn
    - wastedassign
    - perfsprint
    - usestdlibvars
    - mirror
    - fatcontext
    - cyclop
    - maintidx
    - varnamelen
    - interfacebloat
    - nonamedreturns
    - testifylint

  settings:
    tagliatelle:
      case:
        rules:
          yaml: snake
          json: snake

linters-settings:
  gocyclo:
    min-complexity: 10
  gocognit:
    min-complexity: 12
  lll:
    line-length: 120
  revive:
    severity: error
    rules:
      - name: exported
      - name: error-return
      - name: argument-limit
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-numbers:
      - '0'
      - '1'
      - '-1'
  contextcheck:
    check-error-free-funcs:
      - (*github.com/DATA-DOG/go-sqlmock.Sqlmock).ExpectExec
      - (*github.com/DATA-DOG/go-sqlmock.Sqlmock).ExpectQuery
  funlen:
    lines: 50
    statements: 30
  cyclop:
    max-complexity: 12
  varnamelen:
    min-name-length: 2
    ignore-names:
      - err
      - i
      - j
      - ok
      - id
      - db
      - tx
  interfacebloat:
    max: 5
  reassign:
    patterns:
      - '.*'
  nilnil:
    checked-types:
      - ptr
      - func
      - iface
      - map
      - chan
  tagliatelle:
    case:
      rules:
        yaml: snake
        json: snake
  wrapcheck:
    ignore-sigs:
      - errors.New
      - .Errorf(
      - fmt.Errorf

formatters:
  enable:
    - gofumpt

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
